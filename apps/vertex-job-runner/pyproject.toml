[project]
name = "vertex-job-runner"
version = "0.1.0"
description = "Command line utilities to run vertex ai custom training job"
readme = "README.md"
authors = [{ name = "haru256", email = "yohei.kuro48@gmail.com" }]
requires-python = ">=3.12"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
  "loguru>=0.7.3",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.14.1",
  "typer>=0.25.1",
  "google-cloud-aiplatform>=1.153.1",
]

[project.scripts]
vrun = "vertex_job_runner.cli:app"

[dependency-groups]
test = ["pytest~=9.0.3", "pytest-console-scripts~=1.4.1"]
lint = ["ruff~=0.15.13", "mypy~=1.14.1"]

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
exclude = [".venv"]
plugins = ["pydantic.mypy"]

follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
no_implicit_reexport = true
disallow_untyped_defs = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[tool.vrun]
project = "haru256-vertex-ai-sandbox"
location = "us-central1"
image_uri = "gcr.io/deeplearning-platform-release/base-cpu:latest"
gcs_uri = "gs://haru256-vertex-ai-sandbox/vertex-job-runner/"
service_account = "hoge@haru256-vertex-ai-sandbox"
experiment_name = "vertex-job-runner-experiment"
command = ["uv", "run", "main.py"]

machine_type = "g2-standard-4"
accelerator_type = "NVIDIA_L4"
accelerator_count = 1
args = ["hoge=2", "fuga=1"]
