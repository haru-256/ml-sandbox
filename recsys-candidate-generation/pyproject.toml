[project]
name = "recsys-candidate-generation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "lightning~=2.5.1",
  "torchmetrics~=1.7.1",
  "numpy~=2.2.4",
  "polars~=1.27.1",
  "torchinfo~=1.8.0",
  "loguru~=0.7.3",
  "hydra-core>=1.3.2",
  "ml-sandbox-libs",
]

[project.optional-dependencies]
cpu = ["torch==2.6.0"]
gpu = ["torch==2.6.0"]

[dependency-groups]
dev = ["notebook~=7.3.2", "ipywidgets>=8.1.5", "tqdm~=4.67.1"]
test = ["pytest~=8.3.4", "pytest-mock~=3.14.0", "deepdiff~=8.1.1"]
lint = ["ruff~=0.11.4", "mypy~=1.14.0"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[tool.uv.sources]
ml-sandbox-libs = { path = "../ml_sandbox_libs", editable = true }
torch = [
  { index = "pytorch-cpu-mac", extra = "cpu", marker = "platform_system == 'macOS'" },
  { index = "pytorch-cpu", extra = "cpu", marker = "platform_system != 'macOS'" },
  { index = "pytorch-gpu", extra = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu-mac"
url = "https://pypi.python.org/simple"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-gpu"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]

[tool.mypy]
python_version = "3.12"
exclude = [".venv"]
disable_error_code = ["import-untyped", "assignment", "unused-ignore"]

follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
no_implicit_reexport = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["torch.*", "deepdiff.*", "datasets.*", ".*"]
ignore_missing_imports = true
