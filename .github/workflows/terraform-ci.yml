name: Terraform CI

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform-ci.yml"
  push:
    branches:
      - "main"
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform-ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-validate:
    name: Lint and Validate
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Resolve Terraform version
        id: tf-version
        working-directory: infra/terraform/envs/dev
        run: |
          constraint="$(
            sed -n 's/.*required_version *= *"\([^"]*\)".*/\1/p' versions.tf \
              | head -n 1 \
              | tr -d ' ' \
              | sed 's/^~>/~/'
          )"
          if [ -z "${constraint}" ]; then
            echo "required_version not found in versions.tf" >&2
            exit 1
          fi
          echo "constraint=${constraint}" >> "${GITHUB_OUTPUT}"
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.tf-version.outputs.constraint }}
          terraform_wrapper: false
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: v0.64.0
      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
      - name: Check formatting
        run: make format-check
      - name: Lint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: make lint
      - name: Validate
        run: make validate
