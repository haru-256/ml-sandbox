name: Find Target Projects
description: Find target projects from changed files.
inputs:
  max_depth:
    description: The maximum depth of the directory to search for projects
    required: true
  required_files:
    description: The required files to identify a project. Each file should be separated by a comma (e.g., pyproject.toml, Makefile)
    required: true
  target_projects:
    description: The projects to run lint and test on. If not provided, it will be determined by the changed files.
    required: false
    default: ""
outputs:
  projects:
    value: ${{ steps.find-target-projects.outputs.projects }}
    description: The list of found projects(json format)
runs:
  using: composite
  steps:
    - name: Get changed directories
      id: changed-files
      uses: tj-actions/changed-files@ed68ef82c095e0d48ec87eccea555d944a631a4c # v46
      with:
        matrix: true # 後続のjobでmatrixで使うために、ファイルをjson形式で出力させる
        dir_names: true # uniqueディレクトリ名を取得
        dir_names_max_depth: ${{ inputs.max_depth }} # ディレクトリ名の深さを指定
        files_ignore: |
          .github/**
    - name: Get toolchain file changes
      id: toolchain-files
      uses: tj-actions/changed-files@ed68ef82c095e0d48ec87eccea555d944a631a4c # v46
      with:
        files: |
          mise.toml
          .github/workflows/python-ci.yml
          .github/actions/**
          make/**
    - name: Print changed files
      run: |
        echo "::debug::Changed files: ${{ steps.changed-files.outputs.all_changed_and_modified_files }}"
        echo "::debug::Toolchain changed: ${{ steps.toolchain-files.outputs.any_changed }}"
      shell: bash
    - name: Find Target Projects
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
      id: find-target-projects
      with:
        script: |
          const fs = require('node:fs');
          dispatch_inputs = "${{ inputs.target_projects }}";
          if (dispatch_inputs !== "") {
            dispatch_inputs = dispatch_inputs.split(',').map(path => path.trim());
            core.setOutput('projects', JSON.stringify(dispatch_inputs));
          } else {
            const required_files = "${{ inputs.required_files }}".split(',').map(path => path.trim());
            const max_depth = parseInt("${{ inputs.max_depth }}", 10);
            const workspace = process.env.GITHUB_WORKSPACE || process.cwd();
            const toolchain_changed = "${{ steps.toolchain-files.outputs.any_changed }}" === "true";

            function isProject(relPath) {
              return required_files.every(file => fs.existsSync(`${workspace}/${relPath}/${file}`));
            }

            function findAllProjects() {
              const projects = [];
              function walk(relPath, depth) {
                if (depth > 0 && depth <= max_depth && isProject(relPath)) {
                  projects.push(relPath);
                }
                if (depth >= max_depth) {
                  return;
                }
                const absPath = relPath === "" ? workspace : `${workspace}/${relPath}`;
                let entries;
                try {
                  entries = fs.readdirSync(absPath, { withFileTypes: true });
                } catch (err) {
                  return;
                }
                for (const entry of entries) {
                  if (!entry.isDirectory() || entry.name.startsWith(".")) {
                    continue;
                  }
                  const child = relPath === "" ? entry.name : `${relPath}/${entry.name}`;
                  walk(child, depth + 1);
                }
              }
              walk("", 0);
              projects.sort();
              return projects;
            }

            let projects;
            if (toolchain_changed) {
              projects = findAllProjects();
            } else {
              const changed_paths = JSON.parse(${{ toJSON(steps.changed-files.outputs.all_changed_and_modified_files) }});
              // convert ['hoge/fuga', 'foo/zoo'] => ['hoge', 'hoge/fuga', 'foo', 'foo/zoo']
              const set = new Set();
              changed_paths.forEach(path => {
                const segments = path.split('/');
                let current = '';
                segments.forEach((segment, index) => {
                  current = index === 0 ? segment : `${current}/${segment}`;
                  set.add(current);
                });
              });
              const changed_directories = Array.from(set);
              projects = changed_directories.filter(path => {
                if (fs.existsSync(path) && fs.statSync(path).isDirectory()) {
                  return required_files.every(file => fs.existsSync(`${path}/${file}`));
                }
                return false;
              });
            }
            core.setOutput('projects', JSON.stringify(projects));
          }
    - name: Print changed directories
      run: |
        echo "::debug::Found Projects: ${{ steps.find-target-projects.outputs.projects }}"
      shell: bash
