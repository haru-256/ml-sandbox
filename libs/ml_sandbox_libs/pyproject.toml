[project]
name = "ml-sandbox-libs"
version = "0.1.0"
description = "Library for the ml-sandbox project"
readme = "README.md"
authors = [{ name = "haru256", email = "yohei.kuro48@gmail.com" }]
requires-python = ">=3.12"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
  "lightning>=2.5.0.post0",
  "torchmetrics>=1.7.3",
  "datasets>=3.2.0",
  "numpy>=2.2.1",
  "polars>=1.18.0",
  "tensorboard>=2.18.0",
  "torchinfo>=1.8.0",
  "loguru>=0.7.3",
  "hydra-core>=1.3.2",
  "google-cloud-logging>=3.11.4",
]

[project.optional-dependencies]
cpu = [
  "torch==2.7.1",
  "pyg_lib",
  "torch_scatter",
  "torch_sparse",
  "torch_cluster",
  "torch_spline_conv",
]
gpu = [
  "torch==2.7.1",
  "pyg_lib",
  "torch_scatter",
  "torch_sparse",
  "torch_cluster",
  "torch_spline_conv",
]

[dependency-groups]
dev = [
  "notebook~=7.3.2",
  "pytest~=8.3.4",
  "pytest-mock~=3.14.0",
  "deepdiff~=8.1.1",
  "mypy~=1.14.0",
  "ipywidgets>=8.1.5",
  "tqdm~=4.67.1",
]
lint = ["ruff~=0.11.4"]

[tool.uv]
package = true
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]
# find-links = [
#   "https://data.pyg.org/whl/torch-2.7.0+cu126.html",
#   "https://data.pyg.org/whl/torch-2.7.0+cpu.html",
# ]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu-mac", extra = "cpu", marker = "platform_system == 'Darwin'" },
  { index = "pytorch-cpu", extra = "cpu", marker = "platform_system != 'Darwin'" },
  { index = "pytorch-gpu", extra = "gpu" },
]
# indexファイルが存在しないため、以下のlinkから明示的にURLを指定
# https://data.pyg.org/whl/torch-2.7.0+cu126.html
# https://data.pyg.org/whl/torch-2.7.0+cpu.html
pyg_lib = [
  { url = "https://data.pyg.org/whl/torch-2.7.0%2Bcpu/pyg_lib-0.4.0%2Bpt27cpu-cp312-cp312-linux_x86_64.whl", extra = "cpu", marker = "platform_system != 'Darwin'" },
  { url = "https://data.pyg.org/whl/torch-2.7.0%2Bcpu/pyg_lib-0.4.0%2Bpt27-cp312-cp312-macosx_14_0_universal2.whl", extra = "cpu", marker = "platform_system == 'Darwin'" },
  { url = "https://data.pyg.org/whl/torch-2.7.0%2Bcu126/pyg_lib-0.4.0%2Bpt27cu126-cp312-cp312-linux_x86_64.whl", extra = "gpu" },
]
torch_scatter = [
  { url = "https://data.pyg.org/whl/torch-2.7.0%2Bcpu/torch_scatter-2.1.2%2Bpt27cpu-cp312-cp312-linux_x86_64.whl", extra = "cpu", marker = "platform_system != 'Darwin'" },
  { url = "https://data.pyg.org/whl/torch-2.7.0%2Bcpu/torch_scatter-2.1.2-cp312-cp312-macosx_10_13_universal2.whl", extra = "cpu", marker = "platform_system == 'Darwin'" },
  { url = "https://data.pyg.org/whl/torch-2.7.0%2Bcu126/torch_scatter-2.1.2%2Bpt27cu126-cp312-cp312-linux_x86_64.whl", extra = "gpu" },
]
torch_sparse = [
  { url = "https://data.pyg.org/whl/torch-2.7.0%2Bcpu/torch_sparse-0.6.18%2Bpt27cpu-cp312-cp312-linux_x86_64.whl", extra = "cpu", marker = "platform_system != 'Darwin'" },
  { url = "https://data.pyg.org/whl/torch-2.7.0%2Bcpu/torch_sparse-0.6.18-cp312-cp312-macosx_11_0_universal2.whl", extra = "cpu", marker = "platform_system == 'Darwin'" },
  { url = "https://data.pyg.org/whl/torch-2.7.0%2Bcu126/torch_sparse-0.6.18%2Bpt27cu126-cp312-cp312-linux_x86_64.whl", extra = "gpu" },
]
torch_cluster = [
  { url = "https://data.pyg.org/whl/torch-2.7.0%2Bcpu/torch_cluster-1.6.3%2Bpt27cpu-cp312-cp312-linux_x86_64.whl", extra = "cpu", marker = "platform_system != 'Darwin'" },
  { url = "https://data.pyg.org/whl/torch-2.7.0%2Bcpu/torch_cluster-1.6.3-cp312-cp312-macosx_10_13_universal2.whl", extra = "cpu", marker = "platform_system == 'Darwin'" },
  { url = "https://data.pyg.org/whl/torch-2.7.0%2Bcu126/torch_cluster-1.6.3%2Bpt27cu126-cp312-cp312-linux_x86_64.whl", extra = "gpu" },
]
torch_spline_conv = [
  { url = "https://data.pyg.org/whl/torch-2.7.0%2Bcpu/torch_spline_conv-1.2.2%2Bpt27cpu-cp312-cp312-linux_x86_64.whl", extra = "cpu", marker = "platform_system != 'Darwin'" },
  { url = "https://data.pyg.org/whl/torch-2.7.0%2Bcpu/torch_spline_conv-1.2.2-cp312-cp312-macosx_10_13_universal2.whl", extra = "cpu", marker = "platform_system == 'Darwin'" },
  { url = "https://data.pyg.org/whl/torch-2.7.0%2Bcu126/torch_spline_conv-1.2.2%2Bpt27cu126-cp312-cp312-linux_x86_64.whl", extra = "gpu" },
]


[[tool.uv.index]]
name = "pytorch-cpu-mac"
url = "https://pypi.python.org/simple"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-gpu"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
extend-select = ["E", "F", "UP", "B", "SIM", "I", "ARG", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
exclude = [".venv"]
disable_error_code = ["import-untyped", "assignment", "unused-ignore"]

follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
no_implicit_reexport = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["torch.*", "deepdiff.*", "datasets.*"]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = ["tests", "samples"]
