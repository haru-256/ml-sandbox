[project]
name = "recsys-ranking"
version = "0.1.0"
description = "Recommendation system ranking module for ML Sandbox project."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "lightning~=2.6.1",
  "litmodels~=0.1.8",
  "torchmetrics~=1.9.0",
  "numpy~=2.4.4",
  "polars~=1.39.3",
  "torchinfo~=1.8.0",
  "loguru~=0.7.3",
  "hydra-core~=1.3.2",
  "wandb~=0.25.1",
  "timm~=1.0.19",
  "ml-sandbox-libs",
  "vertex-job-runner",
]

[project.optional-dependencies]
cpu = ["torch==2.10.0", "torchvision==0.26.0"]
gpu = ["torch==2.10.0", "torchvision==0.26.0"]

[dependency-groups]
dev = ["notebook~=7.5.5", "ipywidgets>=8.1.5", "tqdm~=4.67.1"]
test = ["pytest~=8.4.1", "pytest-mock~=3.15.1", "deepdiff~=8.6.0"]
lint = ["ruff~=0.12.11", "mypy~=1.17.1"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[tool.uv.sources]
ml-sandbox-libs = { path = "../../libs/ml_sandbox_libs", editable = true }
vertex-job-runner = { path = "../../apps/vertex-job-runner", editable = true }
torch = [
  { index = "pytorch-cpu-mac", extra = "cpu", marker = "platform_system == 'Darwin'" },
  { index = "pytorch-cpu", extra = "cpu", marker = "platform_system != 'Darwin'" },
  { index = "pytorch-gpu", extra = "gpu" },
]
torchvision = [
  { index = "pytorch-cpu-mac", extra = "cpu", marker = "platform_system == 'Darwin'" },
  { index = "pytorch-cpu", extra = "cpu", marker = "platform_system != 'Darwin'" },
  { index = "pytorch-gpu", extra = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu-mac"
url = "https://pypi.python.org/simple"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-gpu"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
extend-select = ["E", "F", "UP", "B", "SIM", "I", "ARG", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
exclude = [".venv"]
disable_error_code = ["import-untyped", "assignment", "unused-ignore"]

follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
no_implicit_reexport = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["torch.*", "deepdiff.*", "datasets.*", ".*", "timm"]
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = [
  "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]
