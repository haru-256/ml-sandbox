[project]
name = "transformer"
version = "0.1.0"
description = "Full-scratch Transformer implementation with PyTorch"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "lightning~=2.4.0",
  "torchmetrics~=1.4.1",
  "bertviz~=1.2.0",
  "transformers[torch,onnxruntime,optuna,sentencepiece,sklearn,vision]~=4.16.2",
  "datasets~=2.21.0",
  "spacy[apple]~=3.7.6",
  "numpy~=1.26.4",
  "polars~=1.6.0",
  "rich~=13.8.0",
  "tensorboard~=2.17.1",
  "torchinfo~=1.8.0",
]

[dependency-groups]
dev = ["notebook~=7.3.2", "ipywidgets>=8.1.5", "tqdm~=4.67.1"]
test = ["pytest~=8.4.1", "pytest-mock~=3.14.1", "deepdiff~=8.6.0"]
lint = ["ruff~=0.12.11", "mypy~=1.17.1"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
extend-select = ["E", "F", "UP", "B", "SIM", "I", "ARG", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
exclude = [".venv"]
disable_error_code = ["import-untyped", "assignment", "unused-ignore"]

follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
no_implicit_reexport = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["torch.*", "deepdiff.*", "datasets.*", ".*", "timm"]
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = [
  "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]
