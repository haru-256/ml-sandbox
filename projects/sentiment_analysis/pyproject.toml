[project]
name = "transformer"
version = "0.1.0"
description = "Full-scratch Transformer implementation with PyTorch"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "lightning~=2.6.5",
  "torchmetrics~=1.9.0",
  "bertviz~=1.4.1",
  "transformers[torch,onnxruntime,optuna,sentencepiece,sklearn,vision]~=4.57.6",
  "datasets~=4.8.5",
  "spacy~=3.8.14",
  "numpy~=2.5.1",
  "polars~=1.43.2",
  "rich~=13.9.4",
  "tensorboard~=2.21.0",
  "torchinfo~=1.8.0",
]

[dependency-groups]
dev = ["notebook~=7.6.1", "ipywidgets>=8.1.8", "tqdm~=4.70.0"]
test = ["pytest~=9.1.1", "pytest-mock~=3.15.1", "deepdiff~=9.1.0"]
lint = ["ruff~=0.16.0", "mypy~=2.3.0"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
extend-select = ["E", "F", "UP", "B", "SIM", "I", "ARG", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = "."
exclude = [".venv"]
disable_error_code = ["import-untyped", "assignment", "unused-ignore", "attr-defined"]

follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
no_implicit_reexport = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["torch.*", "deepdiff.*", "datasets.*", ".*", "timm"]
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = [
  "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]
