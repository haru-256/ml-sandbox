[project]
name = "recsys-candidate-generation"
version = "0.1.0"
description = "Recommendation system candidate generation module for ML Sandbox project."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "lightning~=2.6.1",
  "torchmetrics~=1.9.0",
  "numpy~=2.4.4",
  "polars~=1.39.3",
  "torchinfo~=1.8.0",
  "loguru~=0.7.3",
  "hydra-core~=1.3.2",
  "wandb~=0.25.1",
  "timm~=1.0.15",
  "ml-sandbox-libs",
]

[project.optional-dependencies]
cpu = [
    "torch==2.11.0",
    "pyg_lib",
    "torch_scatter",
    "torch_sparse",
    "torch_cluster",
]
gpu = [
  "torch==2.11.0",
  "pyg_lib",
  "torch_scatter",
  "torch_sparse",
  "torch_cluster",
]

[dependency-groups]
dev = ["notebook~=7.5.5", "ipywidgets>=8.1.5", "tqdm~=4.67.1"]
test = ["pytest~=9.0.3", "pytest-mock~=3.15.1", "deepdiff~=8.6.2"]
lint = ["ruff~=0.11.4", "mypy~=1.14.0"]
vertex = ["vertex-job-runner"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[tool.uv.sources]
ml-sandbox-libs = { path = "../../libs/ml_sandbox_libs", editable = true }
vertex-job-runner = { path = "../../apps/vertex-job-runner", editable = true }
torch = [
  { index = "pytorch-cpu-mac", extra = "cpu", marker = "platform_system == 'Darwin'" },
  { index = "pytorch-cpu", extra = "cpu", marker = "platform_system != 'Darwin'" },
  { index = "pytorch-gpu", extra = "gpu" },
]
# indexファイルが存在しないため、以下のlinkから明示的にURLを指定
# PyG wheels for torch 2.11.0
# https://data.pyg.org/whl/torch-2.11.0+cu128.html
# https://data.pyg.org/whl/torch-2.11.0+cpu.html
# torch_spline_conv is removed because no torch 2.11.0 wheels exist and it is unused in this repo
pyg_lib = [
  { url = "https://data.pyg.org/whl/torch-2.11.0%2Bcpu/pyg_lib-0.6.0%2Bpt211cpu-cp312-cp312-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl", extra = "cpu", marker = "platform_system != 'Darwin'" },
  { url = "https://data.pyg.org/whl/torch-2.11.0%2Bcpu/pyg_lib-0.6.0%2Bpt211-cp312-cp312-macosx_11_0_arm64.whl", extra = "cpu", marker = "platform_system == 'Darwin'" },
  { url = "https://data.pyg.org/whl/torch-2.11.0%2Bcu128/pyg_lib-0.6.0%2Bpt211cu128-cp312-cp312-manylinux_2_28_x86_64.whl", extra = "gpu" },
]
torch_scatter = [
  { url = "https://data.pyg.org/whl/torch-2.11.0%2Bcpu/torch_scatter-2.1.2%2Bpt211cpu-cp312-cp312-linux_x86_64.whl", extra = "cpu", marker = "platform_system != 'Darwin'" },
  { url = "https://data.pyg.org/whl/torch-2.11.0%2Bcpu/torch_scatter-2.1.2-cp312-cp312-macosx_10_13_universal2.whl", extra = "cpu", marker = "platform_system == 'Darwin'" },
  { url = "https://data.pyg.org/whl/torch-2.11.0%2Bcu128/torch_scatter-2.1.2%2Bpt211cu128-cp312-cp312-linux_x86_64.whl", extra = "gpu" },
]
torch_sparse = [
  { url = "https://data.pyg.org/whl/torch-2.11.0%2Bcpu/torch_sparse-0.6.18%2Bpt211cpu-cp312-cp312-linux_x86_64.whl", extra = "cpu", marker = "platform_system != 'Darwin'" },
  { url = "https://data.pyg.org/whl/torch-2.11.0%2Bcpu/torch_sparse-0.6.18-cp312-cp312-macosx_11_0_universal2.whl", extra = "cpu", marker = "platform_system == 'Darwin'" },
  { url = "https://data.pyg.org/whl/torch-2.11.0%2Bcu128/torch_sparse-0.6.18%2Bpt211cu128-cp312-cp312-linux_x86_64.whl", extra = "gpu" },
]
torch_cluster = [
  { url = "https://data.pyg.org/whl/torch-2.11.0%2Bcpu/torch_cluster-1.6.3%2Bpt211cpu-cp312-cp312-linux_x86_64.whl", extra = "cpu", marker = "platform_system != 'Darwin'" },
  { url = "https://data.pyg.org/whl/torch-2.11.0%2Bcpu/torch_cluster-1.6.3-cp312-cp312-macosx_10_13_universal2.whl", extra = "cpu", marker = "platform_system == 'Darwin'" },
  { url = "https://data.pyg.org/whl/torch-2.11.0%2Bcu128/torch_cluster-1.6.3%2Bpt211cu128-cp312-cp312-linux_x86_64.whl", extra = "gpu" },
]



[[tool.uv.index]]
name = "pytorch-cpu-mac"
url = "https://pypi.python.org/simple"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-gpu"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
extend-select = ["E", "F", "UP", "B", "SIM", "I", "ARG", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
exclude = [".venv"]
disable_error_code = ["import-untyped", "assignment", "unused-ignore"]

follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
no_implicit_reexport = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["torch.*", "deepdiff.*", "datasets.*", ".*"]
ignore_missing_imports = true

[tool.vrun]
project = "haru256-ml-sandbox"
location = "us-central1"
image_uri = "gcr.io/deeplearning-platform-release/base-cpu:latest"
gcs_uri = "gs://haru256-vertex-ai-sandbox/vertex-job-runner/"
service_account = "hoge@haru256-vertex-ai-sandbox"
experiment_name = "vertex-job-runner-experiment"
command = ["uv", "run", "main.py"]

machine_type = "g2-standard-4"
accelerator_type = "NVIDIA_L4"
accelerator_count = 1
args = ["data.num_workers=3"]
