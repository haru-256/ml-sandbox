[project]
name = "common"
version = "0.1.0"
description = "Common utilities for the ml-sandbox project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "lightning~=2.5.0.post0",
  "torch~=2.5.1",
  "torchmetrics~=1.6.1",
  "datasets~=3.2.0",
  "numpy~=2.2.1",
  "polars~=1.18.0",
  "tensorboard~=2.18.0",
  "torchinfo~=1.8.0",
  "loguru~=0.7.3",
]

[dependency-groups]
dev = [
  "notebook~=7.3.2",
  "pytest~=8.3.4",
  "mypy~=1.14.0",
  "ipywidgets>=8.1.5",
  "tqdm~=4.67.1",
]
lint = [
  "ruff~=0.8.4",
]

[tool.uv.sources]
torch = [
  { index = "torch-gpu", marker = "platform_system == 'Linux'"},
]

[[tool.uv.index]]
name = "torch-gpu"
url = "https://download.pytorch.org/whl/cu121"
explicit = true


[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]

[tool.mypy]
python_version = "3.12"
exclude = [".venv"]
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = ["torch.*"]
ignore_missing_imports = true
